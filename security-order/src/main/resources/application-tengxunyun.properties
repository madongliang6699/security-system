#region ========== dubbo配置 开始 =======================
#这个名字什么用和上面的spring.application.name一样吗
dubbo.application.name=security-order
dubbo.scan.base-packages=com.security.order
# 虽然dubbo使用了zk作为注册中心，服务的地址从注册中心获取，但是dubbo默认启动成功之后，从注册中心获取注册信息后会在本地缓存一份（包括本地文件和本地内存），文件存储的位置在用户目录下的.dubbo目录下。因此，服务启动成功之后，zk挂了也没关系，dubbo会使用缓存的注册信息里的IP和端口等地址和参数信息，做服务之间的调用。
dubbo.registry.address=zookeeper://124.222.246.77:2181
# 尽量配置这个超时时间，并且数值大一些，默认的5000毫秒总是连不上zk就报错了。
dubbo.registry.timeout=60000
#dubbo.registry.parameters.session.timeout=60000
#指定当前服务需要订阅的服务提供方，配置了这个属性后，Dubbo 会自动从服务注册中心拉取这些服务的提供者信息，并在本地进行缓存（是不是缓存了之后，注册中心挂了也可以继续调用服务），以便于应用程序可以动态地发现和调用这些服务。
dubbo.cloud.subscribed-services=security-market
##指定提供服务的协议和Dubbo调用端口：这里使用Dubbo协议和20881端口，如果当前服务不对外提供Dubbo调用服务的话，也可以不配置
dubbo.protocol.name=dubbo
dubbo.protocol.port=20881
#指定是否启动的时候就检查服务提供方是否正常，一般配置成false，要不然每次启动都要先启动服务提供者，如果先启动消费者，就报错找不到提供者服务。
dubbo.consumer.check=false
dubbo.provider.threads=800
dubbo.provider.actives=200
# 配置重试次数默认为0，防止幂等性问题，具体调用的地方也可以单独设置次数。
dubbo.consumer.retries=0
dubbo.provider.retries=0
# 配置禁止缓存，但是好像这个配置没起作用，还是有缓存，可能是没弄懂这里禁的缓存是什么缓存，可能不是服务的ip地址的缓存
dubbo.consumer.cache=false
dubbo.provider.cache=false
# 下面的配置不知道干嘛的
#dubbo.application.qosEnable=true
#dubbo.application.qosPort=33333
#dubbo.application.qosAcceptForeignIp=false
#endregion ========== dubbo配置 结束 =======================


