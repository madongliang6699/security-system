#利用命名空间可以实现多测试环境的服务注册隔离,也就是说：不在同一个命名空间的服务是调不通的（专栏里头有讲，自己可以测试一下）
spring.cloud.nacos.discovery.namespace=a9b8e131-eedd-40f8-9bdf-5f778779a271

#========== dubbo配置 开始 =======================
#这个名字什么用和上面的spring.application.name一样吗
dubbo.application.name=security-order-dubbo
dubbo.scan.base-packages=com.security.order
dubbo.registry.address=nacos://124.222.246.77:8848
dubbo.registry.parameters.namespace=a9b8e131-eedd-40f8-9bdf-5f778779a271
dubbo.cloud.subscribed-services=security-market
##指定提供服务的协议和Dubbo调用端口：这里使用Dubbo协议和28087端口，如果当前服务不对外提供Dubbo调用服务的话，也可以不配置
dubbo.protocol.name=dubbo
dubbo.protocol.port=28087
dubbo.consumer.check=false
dubbo.provider.threads=800
dubbo.provider.actives=200
#========== dubbo配置 结束 =======================

