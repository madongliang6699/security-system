#region ========== dubbo配置 开始 =======================
#这个名字什么用和上面的spring.application.name一样吗
dubbo.application.name=security-market
dubbo.scan.base-packages=com.security.market
dubbo.registry.address=zookeeper://124.222.246.77:2181
dubbo.registry.timeout=60000
dubbo.cloud.subscribed-services=security-order
#Dubbo协议和端口
dubbo.protocol.name=dubbo
dubbo.protocol.port=20882

dubbo.consumer.check=false

dubbo.provider.threads=800
dubbo.provider.actives=200
# 配置重试次数默认为0，防止幂等性问题，具体调用的地方也可以单独设置次数。
dubbo.consumer.retries=0
dubbo.provider.retries=0
# 配置缓存
dubbo.consumer.cache=false
dubbo.provider.cache=false

#endregion ========== dubbo配置 结束 =======================


#mybatis配置
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.mapper-locations=classpath*:com/security/**/*.xml


